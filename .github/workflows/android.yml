name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight APK build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      # Exercises scripts/score.ts and fails if an enforced fixture regresses.
      - name: Score the extraction corpus
        run: bun run score

      - name: Typecheck and build
        run: bun run build

  apk:
    name: Debug APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The native project is committed, so this only refreshes the web assets
      # and the plugin list — it does not regenerate the manifest.
      - name: Build web assets and sync
        run: |
          bun run build
          bunx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zentask-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Signed release APK + AAB
    needs: checks
    # Never on pull requests: a fork PR must not be able to reach the signing
    # secrets, and GitHub would withhold them anyway.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build web assets and sync
        run: |
          bun run build
          bunx cap sync android

      - name: Read version name
        id: version
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Written to the runner's temp dir, which is outside the workspace and is
      # destroyed with the runner. It is never echoed and never uploaded.
      - name: Decode keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release build skipped::ANDROID_KEYSTORE_BASE64 is not set. See the README for how to create the signing secrets."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release
        if: steps.signing.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # run_number only ever increases, which is what Play requires.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      # The one thing CI can actually prove about signing: that the artifact
      # carries a real certificate and it is the expected one.
      - name: Verify the APK is signed
        if: steps.signing.outputs.present == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)"
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "Verifying $APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.present == 'true'
        with:
          name: zentask-release-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90
