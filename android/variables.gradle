ext {
    // 26 (Android 8.0, 2017) because ML Kit's entity extractor declares that
    // floor and the manifest merger will not go below it. The alternative —
    // tools:overrideLibrary — forces the build through and then crashes on the
    // devices it excluded, which is worse than not supporting them honestly.
    // Android 7 is nine years old and no longer receives Play Services
    // updates; if that trade ever stops being worth it, drop the
    // entity-extraction dependency and put this back to 24.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}